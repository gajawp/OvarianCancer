# Multi-GPU Training Configuration for MTA-Swin Transformer on H200

# Basic settings
seed: 42
output_dir: "outputs"

# Model configuration
model:
  name: "mta_swin_tiny"
  num_classes: 1000
  drop_path_rate: 0.2

  stage_qk_conv: [true, true, false, false]
  stage_head_mixing: [false, false, true, true]
  stage_group_norm: [true, true, false, false]

  cq: 5
  ck: 11 
  ch: 2
  label_smoothing: 0.1

# Data configuration
data:
  data_dir: "/projects/insightx-lab/imagenet-1k"
  batch_size: 2048
  num_workers: 16
  img_size: 224
  pin_memory: true

# Augmentation configuration
aug:
  mixup: 0.8                    # Mixup alpha
  cutmix: 1.0                   # CutMix alpha
  mixup_prob: 1.0               # Probability of applying mixup/cutmix
  mixup_switch_prob: 0.5        # Probability of switching between mixup and cutmix
  mixup_mode: "batch"           # Apply mixup per batch

# Training configuration
epochs: 300
grad_clip: 5.0
print_freq: 50                
save_freq: 20

# Optimizer settings
optimizer:
  name: "adamw"
  lr: 1.4e-3
  weight_decay: 0.05       
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Learning rate scheduler
scheduler:
  name: "cosine"                
  min_lr: 1.4e-5                
  warmup_epochs: 25
  warmup_lr_init: 1.4e-6        

# Early stopping
early_stopping:
  enabled: false                
  patience: 30                  
  min_delta: 0.001
  mode: "max"
  restore_best_weights: true

# Logging
tensorboard: true

# Performance optimizations (V100 specific)
performance:
  amp: true
  amp_dtype: "bf16"
  cudnn_benchmark: true         
  gradient_checkpointing: false

# Multi-GPU specific settings
distributed:
  backend: "nccl"
  find_unused_parameters: false
  broadcast_buffers: true